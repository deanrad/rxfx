id: tc-04-analytics-queueing
name: Send analytics events (queueing)
description: Run events one-at-a-time in order (concatMap).
tags: [seed, queueing, promise]
inputs:
  context:
    fixture: fixtures
  prompt: |
    Using the effect-from-language skill, generate the @rxfx/effect
    implementation for this scenario and save the TypeScript to a file named
    `effect.ts` in the current directory:

    "Send analytics events; run them one-at-a-time in order (serial)."
graders:
    - type: file
      name: writes_effect_and_structure
      config:
        must_exist: ["effect.ts"]
        content_patterns:
          - path: "effect.ts"
            must_match:
              - "createQueueingEffect"
              - "@rxfx/effect"
            must_not_match:
              - "createBlockingEffect"
              - "createSwitchingEffect"
    - type: program
      name: compiles
      config:
        command: bash
        args:
          - "-c"
          - 'cd "$WAZA_WORKSPACE_DIR" && npx --yes --package=typescript@5.4 tsc -p tsconfig.json'
        timeout: 180
