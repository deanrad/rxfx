id: tc-02-save-blocking
name: Submit a form (blocking)
description: Ignore repeat submits while one request is in flight (exhaustMap).
tags: [seed, blocking, promise]
inputs:
  context:
    fixture: fixtures
  prompt: |
    Using the effect-from-language skill, generate the @rxfx/effect
    implementation for this scenario and save the TypeScript to a file named
    `effect.ts` in the current directory:

    "Submit a form to the server; ignore repeat submits while one is in flight."
graders:
    - type: file
      name: writes_effect_and_structure
      config:
        must_exist: ["effect.ts"]
        content_patterns:
          - path: "effect.ts"
            must_match:
              - "createBlockingEffect"
              - "@rxfx/effect"
            must_not_match:
              - "createQueueingEffect"
              - "createSwitchingEffect"
    - type: program
      name: compiles
      config:
        command: bash
        args:
          - "-c"
          - 'cd "$WAZA_WORKSPACE_DIR" && npx --yes --package=typescript@5.4 tsc -p tsconfig.json'
        timeout: 180
